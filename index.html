<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrio</title>
    <style>
        /* MODERN UI TASARIMI (CSS) */
        :root {
            --arkaplan: #F4F7F6;
            --kart-arkaplan: #FFFFFF;
            --vurgu-renk: #4361EE; /* Elektrik Mavisi */
            --basari-renk: #2EC4B6; /* Zümrüt Yeşili */
            --tehlike-renk: #E71D36; /* Kırmızı */
            --yazi-ana: #2B2D42;
            --yazi-pasif: #8D99AE;
            --golge: 0 10px 20px rgba(0,0,0,0.05);
            --kose-yuvarlama: 16px;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--arkaplan); color: var(--yazi-ana); margin: 0; padding: 20px; padding-bottom: 100px; }
        h1, h2 { text-align: center; margin-bottom: 15px; }
        .gizli { display: none !important; }

        /* Kart ve Kutu Tasarımları (Derinlik) */
        .kart { background: var(--kart-arkaplan); padding: 20px; border-radius: var(--kose-yuvarlama); box-shadow: var(--golge); margin-bottom: 20px; }
        .liste-elemani { background: var(--kart-arkaplan); padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: var(--golge); display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--vurgu-renk); }
        .liste-detay { font-size: 13px; color: var(--yazi-pasif); margin-top: 5px; display: block; }
        
        /* Skor Tabelası */
        .skor-paneli { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
        .skor-kutu { flex: 1 1 45%; text-align: center; background: var(--arkaplan); padding: 15px 5px; border-radius: 12px; }
        .skor-kutu strong { display: block; font-size: 24px; color: var(--vurgu-renk); }
        .hedef-yazi { font-size: 11px; color: var(--yazi-pasif); display: block; margin-top: 3px; }

        /* Düğmeler (Köşe Yuvarlatma ve Vurgu) */
        button { background-color: var(--vurgu-renk); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        .btn-tehlike { background-color: var(--tehlike-renk); width: auto; padding: 10px 14px; margin-top: 0; }
        .btn-duzenle { background-color: var(--basari-renk); width: auto; padding: 10px 14px; margin-top: 0; margin-right: 5px; }
        .btn-ikincil { background-color: var(--yazi-pasif); }
        .buton-grubu { display: flex; gap: 5px; }

        /* Girdi Alanları (Nefes Alanı) */
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #DFE2E6; border-radius: 10px; font-size: 16px; box-sizing: border-box; background-color: #FAFAFA; outline: none; }
        input:focus, select:focus { border-color: var(--vurgu-renk); }
        label { font-size: 14px; font-weight: bold; color: var(--yazi-ana); display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- 0. KULLANICI PROFİLİ SİHİRBAZI -->
    <div id="profil-ekrani" class="gizli kart">
        <h1>Hedeflerini Belirle</h1>
        <p style="text-align:center; font-size:14px; color:#8D99AE;">Günlük ihtiyacını bilimsel olarak hesaplayalım.</p>
        
        <label>Cinsiyet</label>
        <select id="pr-cinsiyet"><option value="erkek">Erkek</option><option value="kadin">Kadın</option></select>
        
        <label>Yaş</label>
        <input type="number" id="pr-yas" placeholder="Örn: 25">
        
        <label>Boy (cm)</label>
        <input type="number" id="pr-boy" placeholder="Örn: 175">
        
        <label>Kilo (kg)</label>
        <input type="number" id="pr-kilo" placeholder="Örn: 70">
        
        <label>Haftalık Hareket Seviyesi</label>
        <select id="pr-hareket">
            <option value="1.2">Masa Başı / Hareketsiz</option>
            <option value="1.375">Haftada 1-3 Gün Hafif Spor</option>
            <option value="1.55">Haftada 3-5 Gün Orta Tempo</option>
            <option value="1.725">Haftada 6-7 Gün Ağır Antrenman</option>
        </select>
        
        <button onclick="profilKaydet()">Hesapla ve Başla</button>
    </div>

    <!-- 1. ANA EKRAN -->
    <div id="ana-ekran" class="gizli">
        <h1 style="font-size: 24px;">Günlük Yakıtın</h1>
        
        <div class="kart">
            <div class="skor-paneli">
                <div class="skor-kutu"><strong id="gun-kalori">0</strong><span>Kalori</span><span class="hedef-yazi" id="hedef-kalori">Hedef: 0</span></div>
                <div class="skor-kutu"><strong id="gun-protein">0</strong><span>Protein</span><span class="hedef-yazi" id="hedef-protein">Hedef: 0g</span></div>
                <div class="skor-kutu"><strong id="gun-yag">0</strong><span>Yağ</span><span class="hedef-yazi" id="hedef-yag">Hedef: 0g</span></div>
                <div class="skor-kutu"><strong id="gun-karb">0</strong><span>Karb</span><span class="hedef-yazi" id="hedef-karb">Hedef: 0g</span></div>
            </div>
        </div>

        <button onclick="sayfaGoster('tuketim-ekrani')">Günüme Besin Ekle (+)</button>
        <button class="btn-ikincil" onclick="sayfaGoster('kutuphane-ekrani')">Besin Kütüphanemi Aç</button>
        <button style="background:none; color:#8D99AE; text-decoration:underline; box-shadow:none;" onclick="sayfaGoster('profil-ekrani')">Profilimi Güncelle</button>

        <h2>Bugün Yediklerim</h2>
        <div id="yenenler-listesi"></div>
    </div>

    <!-- 2. BESİN KÜTÜPHANESİ -->
    <div id="kutuphane-ekrani" class="gizli">
        <h1>Besin Listesi</h1>
        <button class="btn-ikincil" onclick="sayfaGoster('ana-ekran')" style="margin-bottom:15px;">Ana Ekrana Dön</button>
        <button onclick="besinFormuAc()">Yeni Besin Ekle (+)</button>
        
        <h2 style="margin-top: 25px;">Kayıtlı Besinler</h2>
        <div id="kutuphane-listesi"></div>
    </div>

    <!-- 3. YENİ BESİN OLUŞTUR / DÜZENLE -->
    <div id="besin-form-ekrani" class="gizli kart">
        <h2 id="form-baslik">Besin Ekle/Düzenle</h2>
        <input type="hidden" id="b-id">
        <label>Besin Adı</label><input type="text" id="b-ad">
        <label>Referans Miktar (Gram için 100, Adet için 1)</label><input type="number" id="b-ref">
        <label>Kalori (Kcal)</label><input type="number" id="b-cal">
        <label>Protein (g)</label><input type="number" step="0.1" id="b-pro">
        <label>Yağ (g)</label><input type="number" step="0.1" id="b-yag">
        <label>Karbonhidrat (g)</label><input type="number" step="0.1" id="b-karb">
        <button onclick="besinKaydet()">Kaydet</button>
        <button class="btn-tehlike" onclick="sayfaGoster('kutuphane-ekrani')" style="width:100%; margin-top:10px;">İptal</button>
    </div>

    <!-- 4. TÜKETİM EKLEME -->
    <div id="tuketim-ekrani" class="gizli kart">
        <h2>Ne Yedin?</h2>
        <select id="t-secim"></select>
        <label>Miktar (Gram / Adet)</label>
        <input type="number" id="t-miktar" placeholder="Kaç birim yedin?">
        <button onclick="tuketimKaydet()">Bugüne Ekle</button>
        <button class="btn-tehlike" onclick="sayfaGoster('ana-ekran')" style="width:100%; margin-top:10px;">İptal</button>
    </div>

    <script>
        // VERİ TOHUMLAMA (Başlangıç Hafızası - Excel Listesi)
        const tohumVeriler = [
            { id: 1, ad: "Mozarella Peynir", ref: 100, pro: 18, yag: 19, karb: 1, cal: 247 },
            { id: 2, ad: "Yumurta (adet)", ref: 1, pro: 6.28, yag: 4.75, karb: 0.2, cal: 72 },
            { id: 3, ad: "Ekmek", ref: 100, pro: 5.22, yag: 1, karb: 50, cal: 249 },
            { id: 4, ad: "Makarna", ref: 100, pro: 7.2, yag: 1.3, karb: 72, cal: 352 },
            { id: 5, ad: "Mercimek", ref: 100, pro: 17.5, yag: 1.6, karb: 49, cal: 334 },
            { id: 6, ad: "Nohut", ref: 100, pro: 12, yag: 6.1, karb: 48, cal: 355 },
            { id: 7, ad: "Fasülye", ref: 100, pro: 13.8, yag: 1.6, karb: 46, cal: 326 },
            { id: 8, ad: "Tavuk Göğüsü", ref: 100, pro: 23, yag: 0.7, karb: 0, cal: 102 },
            { id: 9, ad: "Sebze", ref: 100, pro: 0, yag: 0, karb: 0, cal: 0 },
            { id: 10, ad: "Puding", ref: 100, pro: 2000, yag: 300, karb: 1040, cal: 15200 },
            { id: 11, ad: "Meyve", ref: 100, pro: 0, yag: 0, karb: 15, cal: 15 },
            { id: 12, ad: "Lungo Pirinç", ref: 100, pro: 4.02, yag: 0.4, karb: 80, cal: 354 },
            { id: 13, ad: "Basmati Pirinç", ref: 100, pro: 5.16, yag: 1.1, karb: 78, cal: 358 },
            { id: 14, ad: "Toz Peynir", ref: 100, pro: 34, yag: 27, karb: 1, cal: 383 },
            { id: 15, ad: "Zeytinyağ (gram)", ref: 100, pro: 0, yag: 100, karb: 0, cal: 900 },
            { id: 16, ad: "Ricotta Peynir", ref: 100, pro: 7.7, yag: 9, karb: 3.9, cal: 127 },
            { id: 17, ad: "Protein Tozu", ref: 100, pro: 73, yag: 5.5, karb: 12, cal: 391 },
            { id: 18, ad: "Süt Yağsız", ref: 100, pro: 3.4, yag: 0, karb: 5.1, cal: 34 },
            { id: 19, ad: "Süt Yağlı", ref: 100, pro: 3.3, yag: 3.3, karb: 4.7, cal: 61 },
            { id: 20, ad: "Süt Yarım Yağlı", ref: 100, pro: 3.3, yag: 1.6, karb: 4.8, cal: 47 },
            { id: 21, ad: "Yoğurt", ref: 100, pro: 3.6, yag: 3.7, karb: 4.7, cal: 67 },
            { id: 22, ad: "Fish Fingers", ref: 100, pro: 12, yag: 7.9, karb: 15, cal: 179 },
            { id: 23, ad: "Skyr Yoğurt", ref: 100, pro: 11, yag: 0.2, karb: 4, cal: 64 },
            { id: 24, ad: "Un", ref: 100, pro: 6, yag: 0.8, karb: 72, cal: 339 },
            { id: 25, ad: "Yulaf", ref: 100, pro: 8.4, yag: 7, karb: 59, cal: 375 },
            { id: 26, ad: "Tavuk Ciğeri", ref: 100, pro: 16, yag: 6, karb: 0, cal: 122 }
        ];

        // HAFIZA KONTROLÜ
        let besinler = JSON.parse(localStorage.getItem('df_besinler'));
        if(!besinler || besinler.length === 0) {
            besinler = tohumVeriler;
            localStorage.setItem('df_besinler', JSON.stringify(besinler));
        }
        let bugunYenenler = JSON.parse(localStorage.getItem('df_gunluk')) || [];
        let profil = JSON.parse(localStorage.getItem('df_profil'));

        // SAYFA YÖNETİMİ
        function sayfaGoster(id) {
            document.querySelectorAll('body > div').forEach(d => d.classList.add('gizli'));
            document.getElementById(id).classList.remove('gizli');
            if(id === 'ana-ekran') arayuzGuncelle();
            if(id === 'kutuphane-ekrani') kListele();
            if(id === 'tuketim-ekrani') tDoldur();
        }

        // 1. PROFİL VE HESAPLAMA SİSTEMİ
        function profilKaydet() {
            let cins = document.getElementById('pr-cinsiyet').value;
            let yas = parseFloat(document.getElementById('pr-yas').value);
            let boy = parseFloat(document.getElementById('pr-boy').value);
            let kilo = parseFloat(document.getElementById('pr-kilo').value);
            let hare = parseFloat(document.getElementById('pr-hareket').value);
            
            if(!yas || !boy || !kilo) { alert("Lütfen yaş, boy ve kilonuzu eksiksiz girin."); return; }

            // Mifflin-St Jeor Formülü
            let bmr = cins === 'erkek' ? (10*kilo) + (6.25*boy) - (5*yas) + 5 : (10*kilo) + (6.25*boy) - (5*yas) - 161;
            let kalori = Math.round(bmr * hare);
            let p_hedef = Math.round(kilo * 2.2); // Spora uygun yüksek protein
            let y_hedef = Math.round((kalori * 0.25) / 9); // Kalorinin %25'i yağ
            let k_hedef = Math.round((kalori - (p_hedef*4) - (y_hedef*9)) / 4);

            profil = { kalori, pro: p_hedef, yag: y_hedef, karb: k_hedef };
            localStorage.setItem('df_profil', JSON.stringify(profil));
            sayfaGoster('ana-ekran');
        }

        // 2. KÜTÜPHANE İŞLEMLERİ (CRUD)
        function kListele() {
            const liste = document.getElementById('kutuphane-listesi');
            liste.innerHTML = '';
            besinler.forEach(b => {
                liste.innerHTML += `
                    <div class="liste-elemani">
                        <div style="flex:1;">
                            <strong style="color:var(--vurgu-renk);">${b.ad}</strong>
                            <span class="liste-detay">${b.ref} birim | ${b.cal} kcal | P:${b.pro} Y:${b.yag} K:${b.karb}</span>
                        </div>
                        <div class="buton-grubu">
                            <button class="btn-duzenle" onclick="besinDuzenle(${b.id})">✎</button>
                            <button class="btn-tehlike" onclick="besinSil(${b.id})">✖</button>
                        </div>
                    </div>`;
            });
        }

        function besinFormuAc() {
            document.querySelectorAll('#besin-form-ekrani input').forEach(inp => inp.value = '');
            sayfaGoster('besin-form-ekrani');
        }

        function besinKaydet() {
            let id = document.getElementById('b-id').value;
            let yeni = {
                id: id ? parseInt(id) : Date.now(),
                ad: document.getElementById('b-ad').value,
                ref: parseFloat(document.getElementById('b-ref').value),
                cal: parseFloat(document.getElementById('b-cal').value),
                pro: parseFloat(document.getElementById('b-pro').value),
                yag: parseFloat(document.getElementById('b-yag').value),
                karb: parseFloat(document.getElementById('b-karb').value)
            };
            if(id) { besinler[besinler.findIndex(x => x.id == id)] = yeni; } 
            else { besinler.push(yeni); }
            
            localStorage.setItem('df_besinler', JSON.stringify(besinler));
            sayfaGoster('kutuphane-ekrani');
        }

        function besinDuzenle(id) {
            let b = besinler.find(x => x.id === id);
            document.getElementById('b-id').value = b.id;
            document.getElementById('b-ad').value = b.ad;
            document.getElementById('b-ref').value = b.ref;
            document.getElementById('b-cal').value = b.cal;
            document.getElementById('b-pro').value = b.pro;
            document.getElementById('b-yag').value = b.yag;
            document.getElementById('b-karb').value = b.karb;
            sayfaGoster('besin-form-ekrani');
        }

        function besinSil(id) {
            if(confirm("Bu yiyeceği kütüphaneden tamamen silmek istiyor musun?")) {
                besinler = besinler.filter(x => x.id !== id);
                localStorage.setItem('df_besinler', JSON.stringify(besinler));
                kListele();
            }
        }

        // 3. GÜNLÜK TÜKETİM
        function tDoldur() {
            let sec = document.getElementById('t-secim');
            sec.innerHTML = '<option value="">-- Besin Seç --</option>';
            besinler.forEach(b => sec.innerHTML += `<option value="${b.id}">${b.ad}</option>`);
        }

        function tuketimKaydet() {
            let id = document.getElementById('t-secim').value;
            let mik = parseFloat(document.getElementById('t-miktar').value);
            if(!id || !mik) return alert("Eksik bilgi girdiniz.");
            
            let b = besinler.find(x => x.id == id);
            let carpan = mik / b.ref; // Meşhur Excel formülümüz
            
            bugunYenenler.push({
                id: Date.now(), ad: b.ad, miktar: mik,
                cal: Math.round(b.cal * carpan), pro: (b.pro * carpan).toFixed(1),
                yag: (b.yag * carpan).toFixed(1), karb: (b.karb * carpan).toFixed(1)
            });
            
            localStorage.setItem('df_gunluk', JSON.stringify(bugunYenenler));
            document.getElementById('t-miktar').value = '';
            sayfaGoster('ana-ekran');
        }

        function arayuzGuncelle() {
            let tCal = 0, tPro = 0, tYag = 0, tKarb = 0;
            let liste = document.getElementById('yenenler-listesi');
            liste.innerHTML = '';

            bugunYenenler.forEach(t => {
                tCal += parseFloat(t.cal); tPro += parseFloat(t.pro); tYag += parseFloat(t.yag); tKarb += parseFloat(t.karb);
                liste.innerHTML += `
                    <div class="liste-elemani" style="border-left-color:var(--basari-renk);">
                        <div><strong>${t.ad}</strong><span class="liste-detay">${t.miktar} birim</span></div>
                        <div style="text-align:right;"><strong>${t.cal} kcal</strong><span class="liste-detay">P:${t.pro} Y:${t.yag} K:${t.karb}</span></div>
                    </div>`;
            });

            document.getElementById('gun-kalori').innerText = Math.round(tCal);
            document.getElementById('gun-protein').innerText = Math.round(tPro);
            document.getElementById('gun-yag').innerText = Math.round(tYag);
            document.getElementById('gun-karb').innerText = Math.round(tKarb);

            if(profil) {
                document.getElementById('hedef-kalori').innerText = `Hedef: ${profil.kalori}`;
                document.getElementById('hedef-protein').innerText = `Hedef: ${profil.pro}g`;
                document.getElementById('hedef-yag').innerText = `Hedef: ${profil.yag}g`;
                document.getElementById('hedef-karb').innerText = `Hedef: ${profil.karb}g`;
            }
        }

        // BAŞLANGIÇ KONTROLÜ
        if(!profil) { sayfaGoster('profil-ekrani'); } else { sayfaGoster('ana-ekran'); }
    </script>
</body>
</html>
